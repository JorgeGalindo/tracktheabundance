name: Update tracking feed

# A diario: si hay ANTHROPIC_API_KEY, busca novedades del abundance-funding en
# Europa (Claude + web search) y las fusiona en data/tracking.json. Si algo
# cambia, hace commit; la integración Git de Vercel redespliega sola.
on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC cada día
  workflow_dispatch: {} # lanzable a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: update-tracking
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Actualizar feed de tracking
        if: env.ANTHROPIC_API_KEY != ''
        run: npm run update:tracking

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tracking.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el feed."
          else
            git commit -m "Tracking: actualización automática ($(date -u +%F))"
            git push
            echo "Feed actualizado; Vercel redesplegará."
          fi
